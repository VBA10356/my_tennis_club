{% extends "master.html" %}
{% block title %} 
{% load static %}
<title>My Super Hero Club - List of all members</title>

<style>



    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        
    }



    table {
        background-color: blanchedalmond;
        align-self: center;
        border-radius: 10px;
        border-collapse: collapse;
    }

    table tr >th{
        background-color: rgb(14, 105, 151); 
        color: rgb(0, 0, 0);
    }

    table tr> td {
        background-color: rgb(117, 160, 105);
        color : white;
        border: 1px solid rgb(255, 255, 255);
    }

    table tr th:nth-child(1) {
        border-top-left-radius: 10px;
        border: none;
    }

    table tr th:last-child {
        border-top-right-radius: 10px;
        border: none;
    }

    table tr> th, td{
        padding: 20px;
        /* border: 2px solid black; */
        
        


    }

    table tr:last-child> td:nth-child(1){
        /* background-color: aliceblue; */
        /* color: rgb(196, 123, 123);
    } */
        border-bottom-left-radius: 10px;
    }
    
    table tr:last-child> td:last-child{
        /* background-color: aliceblue; */
        /* color: rgb(196, 123, 123);
    } */
        border-bottom-right-radius: 10px;
    }

    ul {
        display: flex;
        color: white;
        justify-content: center;
    }

    nav {
        display: flex;
        background-color: rgb(253, 253, 253);
        align-items: center;
        justify-content: flex-start;
        gap: 20px;
        width: 80%;
        margin: 10px;
        height: 40px;
        padding: 12px;
        padding-left: 10px;
        border-radius: 5px;
    }

    nav >div, p {
        /* background-color: aliceblue; */
        padding: 6px;
        height: 60%;
        display: flex;
        align-items: center;
        width: auto;
        border-radius: 5px;
        transition-duration: .1s;

    }

    th, td a {
        text-decoration: none;
        list-style: none;
        text-decoration: none;
        /* color: rgb(199, 199, 255); */
        color: blue;
        text-align: center;
    }

    nav> div:hover, p:hover {
        background-color: rgb(190, 255, 255);
        transition-duration: .1s;
    }
</style>
{% endblock %}


{% block content%}
   
   
        
        <table>
        <tr>
            <th>Name</th>
            <th>Slug</th>
            <th>Hero-Name</th>
            <th>Movie-Date</th>
        </tr>

        {% for x in mymembers%}
        <tr>
            <td><a href="{% url 'details' x.slug %}">{{x.firstName}} {{x.lastName}}</a></td>
            <td>{{x.slug}}</td>
            <td>{{x.heroName}}</td>
            <td>{{x.movie_year}}</td>
        </tr>
        {% endfor %}
        </table>
    

{% endblock %}
